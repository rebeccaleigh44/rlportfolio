# Sentara Health: Agentic claims search
# [Square brackets] = placeholder. Swap or delete.
order: 2
client: Sentara Health
title: Finding the right claim without knowing what to search for
subtitle: Agentic claims search at Sentara
teaser: An AI search assistant that helps staff find claims by describing the problem.
year: '[2025]'
sector: Healthcare
palette: ['#2f7a62', '#ffd75e', '#5fae93', '#1f5646']
logo: sentara
card: /work/sentara/card.webp
cover:
  src: /work/sentara/card.webp
  alt: Sentara claims list with a primary care bill and its status
  ratio: '16 / 9'
  fit: contain

tldr:
  - Staff searching claims had to know exact IDs and codes before they could find anything. Most of the time, they didn't.
  - I designed an agentic search experience where people describe what they're looking for in plain language, and the system shows its reasoning as it narrows results.
  - '[Headline result: e.g. median time to find a claim dropped from X to Y.]'

overview: >-
  Sentara is a [not-for-profit health system in Virginia and North Carolina]. Behind every claim is a
  member waiting on an answer, and the people looking those claims up were stuck in a search tool
  that only worked if you already knew the answer. We took a stab at something different.

meta:
  role: [Product design, AI interaction design, Research synthesis, Prototyping]
  team: ['[Product manager]', '[ML engineer]', '[Engineering lead]', '[Claims operations SMEs]']
  duration: '[4 months]'
  tools: [Figma, '[Prototyping tool]']

problem:
  question: How might we help claims staff find what they need when they can only describe the problem, not name it?
  stats:
    - value: '[X min]'
      label: average time to locate a claim
    - value: '[X%]'
      label: of searches needing a second or third attempt

process:
  - phase: Shadowing
    detail: Sat with claims staff and watched real lookups, workarounds and sticky notes included.
  - phase: Mapping
    detail: Turned what we saw into the actual mental model people use to describe a claim.
  - phase: Prototyping
    detail: Tested conversational and filter-first approaches side by side.
  - phase: Trust tuning
    detail: Iterated on how much of the agent's reasoning to show.

impact:
  - value: '[X%]'
    label: faster time to the right claim
  - value: '[X]'
    label: fewer escalations per week
  - value: '[X/5]'
    label: staff confidence in results

challenges:
  user: Staff had to translate a member's story into codes and IDs before the search box would help them.
  business: Slow lookups meant longer calls, more escalations and members waiting longer for answers.

stakes:
  - title: Members waiting
    body: Every slow lookup is a person on hold about their healthcare.
  - title: Misplaced trust
    body: An AI that sounds confident and is wrong is worse than no AI at all.
  - title: Adoption
    body: If it didn't beat the old workaround, people would quietly keep the old workaround.

reframe:
  hmw: How might we let staff search the way they already think, while always showing why a result showed up?
  highlight: showing why
  userNeeds: [Search in plain language, See why a result matched, Correct the agent easily]
  businessNeeds: [Shorter handle time, Fewer escalations, Auditable decisions]

decisions:
  - title: How much reasoning to show
    question: Should the agent explain itself, or just return results?
    options:
      - label: Results only
        body: Fast and clean, but in testing nobody trusted a result they couldn't trace.
      - label: Visible reasoning steps
        chosen: true
        body: A short, collapsible trail of what the agent searched and why. People used it to correct the agent instead of starting over.

iterations:
  - title: Too much reasoning, too soon
    body: The first version streamed every step. It felt busy and a little anxious. We collapsed it to a summary line that expands on demand.
    before: { alt: Search results with a long streaming reasoning log, ratio: '4 / 3' }
    after: { alt: Search results with a single collapsible reasoning summary, ratio: '4 / 3' }

hifi:
  - title: Claims at a glance
    body: '[What changed in how claims are listed, and why status and amount owed sit up top.]'
    figures:
      - src: /work/sentara/cover.webp
        alt: Claim cards for primary care, specialist care and an ED visit, each with a status and service date
        ratio: '4 / 3'
        fit: contain

walkthrough:
  device: browser
  steps:
    - title: Describe the claim
      caption: '[What the person types]'
    - title: Watch it narrow
      caption: '[How the agent shows its work]'
    - title: Refine
      caption: '[How people correct or filter]'
    - title: Open the claim
      caption: '[The handoff into the claim record]'

reflection:
  - title: What was hard
    body: '[e.g. designing for an AI whose behaviour kept changing as the model was tuned.]'
  - title: What stuck with me
    body: '[The lesson about trust and AI you want hiring managers to hear.]'

reflection:
  - title: What was hard
    body: '[Be honest. For example: a direction that had to be thrown out, or writing for a government audience you were not part of.]'
  - title: What I'd do differently
    body: '[One concrete thing.]'
  - title: What stuck with me
    body: Writing the design system down first changed everything. When a value wasn't in DESIGN.md, it was a bug, and that made decisions fast.

      caption: The homepage leads with what nForce does in one line, "Find the fraud hiding in public data", and backs it with a sourced statistic.
      figure:
        src: /work/nforce-ai/home.webp
        alt: Homepage hero
        device: browser
    - title: See how detection works
      caption: The anomaly detection page explains the three checks, rules, models and people, in order.

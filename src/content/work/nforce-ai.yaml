# Nforce AI: website redesign and rebuild
# Written from the latest build of the site (nforceai-site with the
# "nforceai-site 3" updates). [Square brackets] = something only you know.
order: 4
client: nForce AI
title: Making fraud detection make sense to the people who buy it
subtitle: The nForce AI website
teaser: A new design system and site for an AI company that finds fraud in government data.
year: '2026'
sector: AI and government
palette: ['#2b3358', '#d17453', '#c49832', '#131d36']
logo: nforce
card: /work/nforce-ai/card.webp
cover:
  src: /work/nforce-ai/home.webp
  alt: The nForce AI homepage, with the headline "Find the fraud hiding in public data" beside a mosaic of rounded gradient shapes
  ratio: '16 / 10'
  device: browser

tldr:
  - nForce AI sells anomaly and fraud detection to U.S. agencies, but the old Webflow site didn't explain what the product actually does, and a few pages were still lorem ipsum.
  - I built a design system around one idea, signal from noise, then designed and rebuilt every page in Astro, keeping each old URL so nothing broke in search.
  - The site launched with an interactive "see how a flag is explained" demo, a training chooser, a contact form that stores nothing, and zero Impeccable anti-patterns on every page.

overview: >-
  nForce AI is a women-owned small business that helps U.S. agencies spot anomalies, stop improper
  payments and explain every finding well enough to survive an audit. That last part is the whole
  pitch, and the old site buried it. The people buying this are auditors and program leads. They
  don't want magic. They want to see the receipt.

meta:
  role: [Design system, Web design, Content design, Front-end build]
  team: ['[nForce AI founders]', '[Other collaborators]']
  duration: '[X weeks]'
  tools: [Figma, Astro, Vercel, Impeccable]

problem:
  question: How might we show a skeptical government buyer that an AI flag can be traced, checked and defended, before they ever book a call?
  stats:
    - value: '3'
      label: blog pages on the old site that were still lorem ipsum
    - value: '[X]'
      label: '[pages on the old Webflow site]'

process:
  - phase: Audit
    detail: Went through the Webflow site page by page and mapped every URL, so the rebuild could match them slug for slug.
  - phase: Design system
    detail: Wrote DESIGN.md first. Color, type, spacing, shapes and motion, all in one file the code is checked against.
  - phase: Pages
    detail: Rewrote and rebuilt each page, homepage and solution pages first, then resources, case studies and legal.
  - phase: Polish and launch
    detail: SEO, accessibility and an Impeccable pass on every page, then handover with a launch checklist.

impact:
  - value: '0'
    label: Impeccable anti-patterns on any page at handover
  - value: '100%'
    label: of old URLs kept or redirected
    detail: The three lorem ipsum blog posts now redirect to a real resource page.
  - value: '[X]'
    label: '[Inquiries, time on page or another result after launch]'

context:
  heading: Why the explanation is the product
  body: >-
    Government fraud teams are drowning in false alarms. A tool that flags more things isn't the
    answer. A tool that tells you why it flagged something, and lets a person sign off before
    anyone acts, is. So the site had to prove explainability, not just claim it.

challenges:
  user: Agency buyers landed on a site full of AI buzzwords and couldn't tell what the product does, how it decides, or whether a finding would hold up.
  business: nForce needed to look credible next to much bigger government contractors, with a small team and a site they could keep up themselves.

stakes:
  - title: Credibility
    body: In government sales, a vague website reads as a vague product.
  - title: Search
    body: Changing URLs during a rebuild can quietly throw away years of search ranking.
  - title: Trust
    body: An AI company that hides how its AI works is a hard sell to an auditor.

reframe:
  hmw: How might we let buyers watch a flag get explained, instead of telling them it can be?
  highlight: watch a flag get explained
  userNeeds: [See what the product does in plain words, Trace a finding back to its evidence, Find the right service fast]
  businessNeeds: [Look established next to big contractors, Keep search traffic through the rebuild, A site the team can update without a developer]

scope:
  body: >-
    The rebuild covered every page on the old site: the homepage, four solution pages, about, responsible AI,
    NAICS codes, resources, two case studies, contact and legal. New features were kept small and vanilla,
    so every page still works with JavaScript turned off.

ideation:
  body: >-
    The creative idea came from the product itself: signal from noise. Calm navy and linen fields with
    grain and translucent overlapping shapes, and exactly one gold circle in every composition. That
    gold circle is the anomaly, the thing nForce found. It shows up in every hero, and once you notice
    it you see it everywhere.
  figures:
    - src: /work/nforce-ai/training.webp
      alt: AI training page hero, with rounded gradient blocks and a single gold circle among them
      device: browser
    - src: /work/nforce-ai/anomaly.webp
      alt: Anomaly detection page hero, with the same shape kit arranged differently
      device: browser

decisions:
  - title: How to prove explainability
    question: Describe it in copy, or let people try it?
    options:
      - label: Describe it
        body: A paragraph about explainable AI is exactly what every competitor already has. It doesn't prove anything.
      - label: An interactive example
        chosen: true
        body: >-
          "See how a flag is explained" lists eight payments. Pick a flagged one and it shows the business rule
          that fired, the model signal behind it and where human review stands. It uses invented data and says so.
        figure:
          src: /work/nforce-ai/flag-explorer.webp
          alt: Payment list with three flagged payments; the selected one shows its business rule, model signal and human review status
          ratio: '1320 / 900'
  - title: Dark or light sections
    question: Navy blocks for drama, or light grounds throughout?
    options:
      - label: Dark navy sections
        body: '[Why the dark sections came out. For example: they felt heavy, made long pages tiring to read, or competed with the shapes.]'
      - label: Light linen gradients
        chosen: true
        body: Every former dark section moved to a cream to lavender gradient with grain. Navy is kept for type, shapes and the footer, so it still anchors the page.

hifi:
  - title: Built around real content
    body: Every page is written in plain language for the buyer, with sources cited under every statistic.
    figures:
      - src: /work/nforce-ai/tools.webp
        alt: AI tools we love page with category filter pills and a grid of tools
        device: browser
      - src: /work/nforce-ai/contact.webp
        alt: Contact page
        device: browser
  - title: Mobile
    body: The shape compositions reflow for small screens, and the headline still leads.
    figures:
